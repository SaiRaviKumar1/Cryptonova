<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoNova — Live Market Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="scanline"></div>
  <div class="noise"></div>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">CRYPTO<span class="accent">NOVA</span></span>
      </div>
      <div class="header-stats" id="globalStats">
        <div class="stat-pill"><span class="stat-label">MARKET CAP</span><span class="stat-val" id="gMarketCap">—</span></div>
        <div class="stat-pill"><span class="stat-label">24H VOL</span><span class="stat-val" id="gVolume">—</span></div>
        <div class="stat-pill"><span class="stat-label">BTC DOM</span><span class="stat-val" id="gBtcDom">—</span></div>
        <div class="stat-pill"><span class="stat-label">COINS</span><span class="stat-val" id="gCoins">—</span></div>
      </div>
      <div class="header-right">
        <div class="live-dot"></div>
        <span class="live-label">LIVE</span>
        <span class="last-update" id="lastUpdate">—</span>
        <a href="https://github.com/SaiRaviKumar1" target="_blank" class="github-btn">
          <svg class="github-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          <div class="github-btn-text">
            <span class="github-btn-name">Ravi</span>
            <span class="github-btn-sub">GitHub</span>
          </div>
        </a>
      </div>
    </div>
  </header>

  <main>
    <!-- TICKER TAPE -->
    <div class="ticker-wrap">
      <div class="ticker" id="tickerInner"></div>
    </div>

    <!-- CONTROLS -->
    <section class="controls">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search coins..." />
      </div>
      <div class="filter-buttons">
        <button class="filter-btn active" data-sort="market_cap_rank">RANK</button>
        <button class="filter-btn" data-sort="current_price">PRICE</button>
        <button class="filter-btn" data-sort="price_change_24h">24H %</button>
        <button class="filter-btn" data-sort="market_cap">MKT CAP</button>
        <button class="filter-btn" data-sort="total_volume">VOLUME</button>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" id="gridViewBtn" title="Grid">⊞</button>
        <button class="view-btn" id="tableViewBtn" title="Table">☰</button>
      </div>
    </section>

    <!-- TRENDING STRIP -->
    <section class="trending-section">
      <span class="trending-label">🔥 TRENDING</span>
      <div class="trending-coins" id="trendingCoins"></div>
    </section>

    <!-- COINS GRID -->
    <section class="coins-section" id="coinsSection">
      <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner-ring"></div>
        <p>FETCHING MARKET DATA…</p>
      </div>
      <div class="coins-grid" id="coinsGrid"></div>
      <div class="coins-table-wrap" id="coinsTableWrap" style="display:none">
        <table class="coins-table">
          <thead>
            <tr>
              <th>#</th><th>COIN</th><th>PRICE</th>
              <th>1H %</th><th>24H %</th><th>7D %</th>
              <th>MKT CAP</th><th>VOLUME</th><th>SUPPLY</th><th>7D CHART</th>
            </tr>
          </thead>
          <tbody id="coinsTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-content" id="modalContent">
        <div class="loading-spinner"><div class="spinner-ring"></div><p>LOADING…</p></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
